services:
  mtools:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:18743:8000"
    environment:
      MTOOLS_ALLOWED_ORIGINS: '["http://127.0.0.1:18743","http://localhost:18743"]'
    volumes:
      - mtools-data:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 64
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  mtools-data:
