[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mtools"
version = "0.2.0"
description = "模块化本地网页工具箱"
requires-python = ">=3.13,<3.14"
dependencies = [
  "anyio>=4.8,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "platformdirs>=4,<5",
  "mcp>=1.26,<2",
  "pywebview>=6,<7 ; sys_platform == 'win32'",
]

[project.scripts]
mtools = "mtools.bootstrap.cli:main"

[dependency-groups]
desktop-build = [
    "pyinstaller>=6.16,<7 ; sys_platform == 'win32'",
]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["apps/server/src/mtools"]

[tool.pytest.ini_options]
testpaths = ["tests/server"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".runtime", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["apps/server/src", "scripts", "tests/server"]

